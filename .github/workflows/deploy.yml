name: Deploy ECS Application

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: backend-repo
  ECS_SERVICE: backend-service
  ECS_CLUSTER: ecs-cluster

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886492071931:role/github-actions-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
         docker build -t backend-repo:${IMAGE_TAG} ./backend

      - name: Tag Docker Image
        run: |
             docker tag backend-repo:${IMAGE_TAG} 886492071931.dkr.ecr.eu-north-1.amazonaws.com/backend-repo:${IMAGE_TAG}


      - name: Push Docker Image
        run: |
         docker push 886492071931.dkr.ecr.eu-north-1.amazonaws.com/backend-repo:${IMAGE_TAG}

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ecs-cluster \
            --service backend-service \
            --force-new-deployment
